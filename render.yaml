# Render blueprint — Field Ops API
#
# Deploys services/field-ops as a Docker web service. Frontend is NOT here:
# the PWA is a static build served by Vercel, and the Dockerfile deliberately
# has no frontend stage (see its header for why).
#
# ── Secrets are NAMES here, never values ───────────────────────────────────
#
# Every secret carries `sync: false`, which tells Render "this blueprint does
# not supply the value; keep whatever is set in the dashboard." That is the
# only reason this file can live in a PUBLIC repository. If you ever replace a
# `sync: false` with a literal, you have published a credential — there is no
# second gate behind this one.
#
# Set the values once in the Render dashboard, or via `render env`:
#
#   DATABASE_URL             Neon POOLED string (host contains -pooler)
#   FIELD_OPS_JWT_SECRET     64 hex chars: python -c "import secrets; print(secrets.token_hex(32))"
#   R2_ACCOUNT_ID            Cloudflare account id
#   R2_ACCESS_KEY_ID         R2 API token, Object Read & Write, scoped to the bucket
#   R2_SECRET_ACCESS_KEY     shown once at token creation
#
# ── Why pooled, and why that is the opposite of the migration rule ─────────
#
# DATABASE_URL must be the POOLED endpoint. A container that restarts holds
# connections open and the direct endpoint runs out of them.
#
# Migrations are the exception: `CREATE EXTENSION` must be the first statement
# in a session, and PgBouncer reuses sessions, so running the root alembic tree
# through the pooler fails with "extension timescaledb has already been loaded
# with another version". Run migrations from an operator machine against the
# DIRECT endpoint (same string minus `-pooler`). This service never migrates on
# boot, by design — a web process racing itself across replicas to run DDL is a
# worse failure than a manual step.

services:
  - type: web
    name: pogf-field-ops-api
    runtime: docker
    plan: free

    # Same region as the Neon branch (AWS ap-southeast-1). Every request this
    # service serves makes at least one round trip to Postgres; putting the two
    # on opposite sides of the planet is the cheapest latency mistake available.
    #
    # Render CANNOT change a service's region after creation, and the default is
    # `oregon` — so an omitted or wrong value here is not a config edit away from
    # fixed, it is a delete-and-recreate.
    region: singapore

    # Deploy on every commit to the linked branch. Stated explicitly because the
    # default is the same and silent, and because the obviously-safer-looking
    # value is a trap right now: `checksPass` deploys only when the branch's CI
    # checks pass, and this repository has no CI to speak of — one workflow
    # (deploy_docs.yml) and zero check-runs reported on main. Setting
    # `checksPass` today would mean deploys never fire, with nothing saying why.
    #
    # Switch to `checksPass` the moment real CI exists; that is the setting you
    # want for a service a field team depends on. `off` disables auto-deploy
    # entirely if you would rather promote by hand before a deployment window.
    #
    # (autoDeployTrigger replaces the deprecated `autoDeploy` boolean.)
    autoDeployTrigger: commit

    # Build context is the REPOSITORY ROOT, not services/field-ops. pyproject.toml
    # and uv.lock live at the root and the Dockerfile COPYs them from there.
    # DEPLOY.md §3 used to say `cd services/field-ops` first; that fails on the
    # first COPY.
    dockerfilePath: ./services/field-ops/Dockerfile
    dockerContext: .

    # main.py exposes GET /health returning {"status":"ok"}. Render routes no
    # traffic until this passes, so a container that boots but cannot reach its
    # dependencies is caught here rather than by a field team.
    healthCheckPath: /health

    envVars:
      # ── Behaviour ────────────────────────────────────────────────────────
      # The production gate in config.py is inferred, not opt-in: a non-loopback
      # DATABASE_URL is enough to turn it on. It is set explicitly anyway so the
      # posture is visible in the manifest rather than implied by a hostname.
      - key: FIELD_OPS_PRODUCTION
        value: "1"

      # Must be "r2". The gate refuses to boot on anything else, because a
      # container filesystem is ephemeral — photos written to disk vanish on the
      # next restart, and the operator who took them is already off the mountain.
      - key: FIELD_OPS_STORAGE_BACKEND
        value: r2

      # Stays EMPTY, and that is the finished state rather than a TODO.
      #
      # vercel.json rewrites /api/:path* to this service, so the browser only
      # ever addresses the Vercel origin: there is no cross-origin request and
      # no preflight, which is one fewer round trip on one bar of signal.
      # Setting this changes nothing while that rewrite is in place.
      #
      # An earlier version of this comment said the Vercel URL "does not exist
      # yet" and that this had to be filled in together with vercel.json or
      # "CORS will fail". Both were wrong: the frontend is deployed, and the
      # rewrite means CORS is not involved at all. Only a genuinely
      # cross-origin deployment needs this, alongside VITE_API_BASE_URL at
      # build time.
      - key: FIELD_OPS_CORS_ORIGINS
        sync: false

      # ── Secrets: names only ──────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: FIELD_OPS_JWT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

# PORT is deliberately absent. Render assigns it at runtime and routes to it;
# the Dockerfile's CMD is shell form so ${PORT:-8001} expands. Pinning it here
# would mean the health check never passes and the deploy rolls back — the
# exact failure main.py's start() docstring warns about.
