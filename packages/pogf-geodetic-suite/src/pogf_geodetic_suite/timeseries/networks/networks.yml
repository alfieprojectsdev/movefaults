  NP:
    description: >-
      No extra exclusions beyond the common IGS set. The widest network,
      and the base the other two subtract from.
    extra_exclusions: []

  NAMRIA:
    description: >-
      Drops the far-field IGS stations, keeping the regional ties.
    extra_exclusions:
      - BAKO
      - BILI
      - GUAM
      - PERT
      - SHAO
      - TSKB
      - TWTF
      - USUD
      - WUHN

  PIVS:
