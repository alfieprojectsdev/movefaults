# Network definitions for the CRD -> ENU -> PLOTS pipeline.
#
# Replaces the three `analysis/02 Time Series/00_CRD_*.bat` files, whose entire
# content was one `findstr /V` with ~270 station codes inlined on a single
# line. Three near-identical scripts differing only in their station list is a
# config file wearing a script costume.
#
# HOW THE THREE DIFFERED, measured from the .bat files rather than assumed:
#
#   263 codes excluded by all three   -> common_exclusions
#   NP      excludes exactly those    -> widest network kept
#   NAMRIA  excludes 9 more            -> drops far-field IGS stations
#   PIVS    excludes 8 more            -> drops the regional fiducials
#
# NAMRIA keeps the regional ties and discards the global ones; PIVS does the
# reverse. That distinction was invisible in the .bat files and is the only
# thing that actually separated them.
#
# A station listed here is REMOVED from the CRD before ENU computation. The
# reference station is chosen separately, at run time.

