<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a56a4" />
    <!-- No manifest link here on purpose. vite-plugin-pwa injects the
         correct <link rel="manifest" href="/manifest.webmanifest"> at
         build time. A hardcoded /manifest.json shadowed it (the browser
         takes the first such link) and, with vercel.json's catch-all
         rewrite, resolved to index.html with HTTP 200 rather than 404 —
         so parsing failed and the app could not be installed at all. -->
    <title>POGF Field Ops</title>
    <script>
      // Set the theme before first paint. Without this the page renders light
      // for one frame and then flips — a white flash straight into the eyes of
      // someone working at dawn or at night, which is exactly who dark mode is
      // for. Deliberately inline and dependency-free so it runs before the
      // bundle loads; useTheme.ts takes over once React mounts.
      (function () {
        try {
          var stored = localStorage.getItem("field_ops_theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#11191f" : "#1a56a4");
        } catch (e) {
          /* storage blocked — fall back to the stylesheet's media query */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
