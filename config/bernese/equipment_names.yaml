# Equipment names as field staff write them -> IGS rcvr_ant.tab names.
#
# OWNER: the processing lead. The project lead owns the tooling that reads it
# (services/bernese-workflow/src/bernese_workflow/equipment_check.py), the same
# split as bpe_errors.yaml beside it. Field staff do NOT edit this file: they
# keep writing what is on the hardware, and this file says what that means.
#
# WHAT IT IS FOR
# `bernese-check-equipment` compares the .STA file's equipment with what
# field-ops records (equipment.csv, logsheet exports). A value equal to the
# .STA's as written needs nothing here. A value that differs is looked up here:
# if it maps to the .STA's name the station is "equal after name map", if it
# maps to another name it is "different", and if it is not here at all it is
# reported as UNMAPPED. The report never guesses a name.
#
# RULES FOR AN ENTRY
#   * The right-hand side must be a real IGS rcvr_ant.tab name, exactly as IGS
#     writes it (upper case; an antenna name without its radome).
#   * Add an entry only when the left-hand text can mean that one model. When
#     in doubt, leave it out: an unmapped name is listed for a person, a wrong
#     entry silently hides a real disagreement.
#   * An identity entry ("TRM41249.00": "TRM41249.00") records that the text as
#     written is already the IGS name, so a disagreement with it is reported as
#     "different" rather than "unmapped".
#   * Keys are matched exactly, after trimming surrounding blanks. Case and
#     inner spaces matter, so each spelling in use gets its own line.
#   * A duplicate key is an error (the loader refuses the file), not "last one
#     wins".
#
# FIRST DRAFT, 2026-11-05, from data/network_inventory/equipment.csv. Every
# right-hand value below appears as written in a TYPE 002 row of the committed
# production capture config/bernese/gpsuser52-luzon/STA/LUZON.STA, whose
# antennas Bernese checks against IGS names; the IGS table itself could not be
# fetched when this was drafted. Left out on purpose, for the processing lead
# to decide:
#   receiver: "MG700", "PMG2" (no IGS name known), "GRX1200+" (LEICA GRX1200+
#             or LEICA GRX1200+GNSS?), "GRX1200GG" (GRX1200GGPRO?),
#             "GRX1200 GNSS" (no "+": LEICA GRX1200+GNSS is likely, not certain)
#   antenna:  "W540C" (no IGS name known), "TRM11500.00" (not an IGS name; the
#             sheet's likely typo for TRM115000.00, reported rather than fixed),
#             "Trimble 5700" (a receiver written in the antenna column)

version: 1

receiver:
  "Trimble 5700": "TRIMBLE 5700"
  "Trimble NetR8": "TRIMBLE NETR8"
  "Trimble NetR9": "TRIMBLE NETR9"
  "Trimble Alloy": "TRIMBLE ALLOY"
  "Leica GR50": "LEICA GR50"
  "GRX1200 Pro": "LEICA GRX1200PRO"
  "GRX1200GG Pro": "LEICA GRX1200GGPRO"
  "GRX1200+GNSS": "LEICA GRX1200+GNSS"
  "GRX1200+ GNSS": "LEICA GRX1200+GNSS"

antenna:
  "Leica AR20": "LEIAR20"
  "AT504GG": "LEIAT504GG"
  "LEIAT504": "LEIAT504"
  "LEIAS10": "LEIAS10"
  "LEIAX1202GG": "LEIAX1202GG"
  "TRM29659.00": "TRM29659.00"
  "TRM39105.00": "TRM39105.00"
  "TRM41249.00": "TRM41249.00"
  "TRM55971.00": "TRM55971.00"
  "TRM57971.00": "TRM57971.00"
  "TRM115000.00": "TRM115000.00"

radome:
  "NONE": "NONE"
  "LEIM": "LEIM"
